server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全性 headers。
    # 注意：nginx 的 add_header 只有在 location 內「完全沒有」add_header 時才會繼承
    # server 層的設定，所以每個自帶 add_header 的 location 都要再寫一次這三行。
    # Referrer-Policy 用 no-referrer：SSO 回跳頁（/auth/callback#ticket=…）載入任何
    # 資源時都不帶 Referer。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Flutter 的靜態檔（main.dart.js、canvaskit、assets）可以長快取，檔名帶 hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ~ \.(js|js\.map|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html 每次都重新拿，避免放出舊版後用戶卡在舊 JS hash。
    # 所有 SPA 路由（含 /auth/callback）經 location / 的 try_files 內部轉到這裡，
    # 實際回應的 header 以這個 location 為準。
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /flutter_service_worker.js {
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA fallback：所有 non-file 請求都送 index.html（含 SSO 回跳 /auth/callback）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 壓縮
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;
}
