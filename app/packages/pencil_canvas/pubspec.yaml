name: pencil_canvas
description: PencilKit canvas platform view for Oidea (iOS/iPadOS only).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PencilCanvasPlugin
