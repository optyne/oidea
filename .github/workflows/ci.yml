name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci (not npm install) so a dependency that is in package.json but
      # missing from the lockfile fails here instead of silently on someone's
      # laptop — that is how @nestjs/schedule went missing locally.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      # nest build type-checks every file under src/, including the ones no
      # test reaches. Without it, ts-jest only compiles the test-reachable
      # subset and type errors elsewhere ship undetected.
      - name: Build
        run: npm run build

  # The in-memory Prisma fakes can only imitate the hand-written partial
  # unique indexes, the advisory locks and the raw lower()/strpos() SQL. This
  # job applies the real migrations to Postgres 16 and runs the spec that
  # proves them against the real Prisma client (H2 review S5). The spec is
  # skipped when TEST_DATABASE_URL is unset, so `npm test` needs no database.
  backend-postgres:
    name: Backend (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oidea
          POSTGRES_PASSWORD: oidea
          POSTGRES_DB: oidea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oidea -d oidea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://oidea:oidea@localhost:5432/oidea_test?schema=public
      TEST_DATABASE_URL: postgresql://oidea:oidea@localhost:5432/oidea_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Real-database spec
        run: npx jest src/employees/postgres.integration.spec.ts --ci

  flutter:
    name: Flutter (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos: the 88 existing infos (deprecated withOpacity,
      # prefer_const) are tracked separately. Errors and warnings still fail.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test
